name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --directory sql_harvard/app
      - run: uv run --directory sql_harvard/app python -c "import compileall; compileall.compile_dir('.', force=True, quiet=1)"
