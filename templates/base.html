<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}CS50 SQL{% endblock %}</title>
        <link rel="stylesheet" href="/static/estilos.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-okaidia.min.css" />
        {% block extra_css %}{% endblock %}
    </head>
    <body>
        <nav>
            <a href="/" class="brand">CS50 SQL — PostgreSQL</a>
            <button class="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="nav-links-main" onclick="var open=this.classList.toggle('open');document.getElementById('nav-links-main').classList.toggle('open');this.setAttribute('aria-expanded', open ? 'true' : 'false')">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="nav-links-main">
                <a href="/tablas"{% if request.url.path == '/tablas' %} aria-current="page"{% endif %}>Tablas</a>
                <a href="/clases/consultas"{% if request.url.path.startswith('/clases/consultas') %} aria-current="page"{% endif %}>Aprende Queries SQL</a>
                <a href="/clases/relaciones"{% if request.url.path.startswith('/clases/relaciones') %} aria-current="page"{% endif %}>Aprende Relaciones de tablas SQL</a>
                <a href="/psets"{% if request.url.path.startswith('/psets') %} aria-current="page"{% endif %}>Problem Sets</a>
                <a href="/proyecto-final"{% if request.url.path == '/proyecto-final' %} aria-current="page"{% endif %}>Proyecto Final</a>
                <a href="/cheatsheet"{% if request.url.path.startswith('/cheatsheet') %} aria-current="page"{% endif %}>Cheatsheet</a>
                <a href="/ejercicios/clase0"{% if request.url.path.startswith('/ejercicios/clase0') %} aria-current="page"{% endif %}>Practica Queries</a>
                <a href="/ejercicios/clase1"{% if request.url.path.startswith('/ejercicios/clase1') %} aria-current="page"{% endif %}>Practica Relaciones</a>
                <a href="/consola" style="color: #58a6ff"{% if request.url.path == '/consola' %} aria-current="page"{% endif %}>Consola</a>
                <a href="https://github.com/jovanyvelez/sql_queries" target="_blank" rel="noopener" class="gh-link">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="vertical-align: middle; margin-right: 4px;" aria-hidden="true">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                    GitHub
                </a>
            </div>
        </nav>
        <div class="container">{% block content %}{% endblock %}</div>
        <button id="back-to-top" type="button" aria-label="Volver arriba">↑</button>
        {% block extra_js %}{% endblock %}
        <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
        <script>
            mermaid.initialize({
                startOnLoad: true,
                theme: "dark",
                securityLevel: "loose",
            });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-sql.min.js"></script>
        <script src="/static/base.js"></script>
    </body>
</html>
